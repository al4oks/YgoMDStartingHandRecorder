name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Build
        run: dotnet build YgoMDStartingHandRecorder.slnx -c Release

      - name: Fetch card table (Records.Smoke dependency)
        run: python tools/fetch_cards.py

      - name: CardLib smoke
        run: dotnet run --project tests/Ygo.CardLib.Smoke -c Release --no-build

      - name: Records smoke
        run: dotnet run --project tests/Ygo.Records.Smoke -c Release --no-build

      # UIA harnesses (tests/av-portable-smoke.ps1) need an interactive desktop
      # and real screen rendering; they run on maintainer machines, not in CI.